[project]
name = "sector-intel"
version = "0.1.0"
description = "Sector Intelligence Monitor — public-filing ingestion, metric extraction, and investing-lens synthesis."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "anthropic>=0.34",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=4.0",
    "langchain-ollama>=0.2",
    "instructor>=1.7",
    "google-genai>=0.8",
    "instructor>=1.3",
    "google-genai>=0.8",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2.40",
    "pymupdf>=1.24",
    "lxml>=5.0",
    "docling>=2.0",
    "tiktoken>=0.7",
    "apscheduler>=3.10,<4.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"