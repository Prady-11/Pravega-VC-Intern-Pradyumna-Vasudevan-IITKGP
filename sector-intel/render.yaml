services:
  - type: web
    name: sector-intel
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/ui/app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableXsrfProtection=false
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////var/data/sector_intel.db
    disk:
      name: sector-data
      mountPath: /var/data
      sizeGB: 1