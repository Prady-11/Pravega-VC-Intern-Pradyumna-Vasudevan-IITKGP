services:
  - type: web
    name: sector-intel
    runtime: python
    plan: free                  # ← change to free
    region: singapore
    buildCommand: pip install -r requirements.txt && python scripts/seed_companies.py
    startCommand: streamlit run app/ui/app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableXsrfProtection=false
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false             # ← set this manually in dashboard
# ← delete the entire disk section